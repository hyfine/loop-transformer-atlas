<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-labelledby="t d">
  <title id="t">U-MoLT · build memory separately from reading a prediction</title>
  <desc id="d">At position t in loop r after the first, the encoder restarts from the token embedding and reads preceding-loop KV only at earlier positions. Its output supplies feedback memory. When a prediction is needed, a causal cross-attention decoder reads encoder-derived KV and feeds the language head; decoder states do not feed the next loop.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4z" fill="#31586a"/></marker></defs>
  <rect width="1080" height="470" rx="16" fill="#f4f9f8"/>
  <g font-family="system-ui, sans-serif" fill="#163849">
    <text x="34" y="35" font-size="14" letter-spacing="2" fill="#24736c">ATLAS REDRAW · 本站示意 · §7.3</text>
    <text x="34" y="73" font-size="27" font-weight="bold">U-MoLT  /  Two paths for the encoder output</text>
    <text x="34" y="105" font-size="16">Position t, loop r &gt; 1  ·  以下示意首轮之后的编码访问</text>
    <g stroke-width="2">
      <rect x="34" y="135" width="230" height="82" rx="10" fill="#e4eef5" stroke="#9fb9c8"/>
      <rect x="345" y="135" width="289" height="82" rx="10" fill="#d6efe7" stroke="#409788"/>
      <rect x="729" y="135" width="314" height="82" rx="10" fill="#e7eefb" stroke="#8aa9cd"/>
      <rect x="34" y="270" width="230" height="83" rx="10" fill="#fff0db" stroke="#d5ac70"/>
      <rect x="345" y="294" width="289" height="82" rx="10" fill="#d6efe7" stroke="#409788"/>
      <rect x="729" y="294" width="314" height="82" rx="10" fill="#e4eef5" stroke="#9fb9c8"/>
    </g>
    <g text-anchor="middle" font-size="19" font-weight="bold">
      <text x="149" y="168">Token embedding</text><text x="490" y="168">MoLA encoder · 编码器</text>
      <text x="886" y="168">Feedback · 编码侧记忆</text><text x="149" y="302">Prior-loop KV</text>
      <text x="490" y="327">Cross-only decoder</text><text x="886" y="327">LM head · 下一词预测</text>
    </g>
    <g text-anchor="middle" font-size="15">
      <text x="149" y="196">从当前位置的嵌入重启</text><text x="490" y="196">current local KV + prefix memory</text>
      <text x="886" y="196">可供后续轮次的更晚位置读取</text><text x="149" y="331">仅前一轮严格前缀 j &lt; t</text>
      <text x="490" y="356">causal encoder KV · j ≤ t</text><text x="886" y="356">只在需要预测时运行读出路径</text>
    </g>
    <g fill="none" stroke="#31586a" stroke-width="2.5" marker-end="url(#a)">
      <path d="M265 176h74"/><path d="M635 176h88"/>
      <path d="M265 310h29q11 0 11-12v-89q0-10 10-10h24"/>
      <path d="M490 218v70"/><path d="M635 335h88"/>
    </g>
    <text x="503" y="254" font-size="15" fill="#24736c">readout only · 预测读出</text>
    <path d="M34 401h1012" stroke="#bfd3d3"/>
    <text x="34" y="431" font-size="17">The decoder does not supply loop feedback. 解码结果不写回编码循环，未使用的中间读出可以省略。</text>
  </g>
</svg>
