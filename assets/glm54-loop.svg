    <text x="34" y="73" font-size="27" font-weight="bold">GLM-5.4  /  78 stored layers, 106 layer executions</text>
    <g fill="none" stroke="#33877e" stroke-width="2"><path d="M258 135v-14h544v14"/></g>
    <text x="530" y="111" text-anchor="middle" font-size="17" fill="#24736c">same 28 layers · 两遍共享权重 θ</text>
