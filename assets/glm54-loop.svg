<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450" role="img" aria-labelledby="t d">
  <title id="t">GLM-5.4 · two visits to one middle block</title>
  <desc id="d">Layers 1–26 prepare the state. Layers 27–54 run twice with distinct update gates. Pass two reuses the first pass's sparse prefix and indices and reads its own local KV window. Layers 55–78 and the language head read the result.</desc>
