="421.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#085F7A" font-weight="700" text-anchor="middle"><tspan x="564.0" dy="0.0">Jacobian Lens</tspan></text><text x="564.0" y="454.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="564.0" dy="0.0">全局工作空间能否跨轮存续</tspan></text><rect x="830.0" y="382.0" width="620.0" height="96.0" rx="12" fill="#E7F2F6" stroke="#79B9CC" stroke-width="1.4"/><text x="852.0" y="421.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#085972" font-weight="700" text-anchor="start"><tspan x="852.0" dy="0.0">发现</tspan></text><text x="852.0" y="454.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="852.0" dy="0.0">Ouro 每轮重建工作空间；Huginn 跨 16 轮传递内容，但读写局限在约 2 轮窗口</tspan></text><rect x="370.0" y="514.0" width="380.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#91C5D6" stroke-width="1.4" filter="url(#sh)"/><path d="M371.0,526.0 a11,11 0 0 1 11,-11 h0 v94.0 h0 a11,11 0 0 1 -11,-11 z" fill="#0B7FA3"/><rect x="371.0" y="515.0" width="6.0" height="94.0" rx="3" fill="#0B7FA3" stroke="#0B7FA3" stroke-width="0"/><text x="564.0" y="553.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#085F7A" font-weight="700" text-anchor="middle"><tspan x="564.0" dy="0.0">机制分析 / 因果干预</tspan></text><text x="564.0" y="586.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="564.0" dy="0.0">权重共享模型上的电路研究</tspan></text><rect x="830.0" y="514.0" width="620.0" height="96.0" rx="12" fill="#E7F2F6" stroke="#79B9CC" stroke-width="1.4"/><text x="852.0" y="553.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#085972" font-weight="700" text-anchor="start"><tspan x="852.0" dy="0.0">发现</tspan></text><text x="852.0" y="586.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="852.0" dy="0.0">Inside the Loop（NeurIPS'26）：揭示循环中的算法电路</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">F10 · 可解释性：循环里到底发生了什么</tspan></text><rect x="572.8" y="34.0" width="84.4" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="615.0" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="615.0" dy="0.0">机制流程</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">四类分析工具及其主要发现</tspan></text><text x="48.0" y="682.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。依据：arXiv 2507.02199、2509.23314、2609.01924、2610.24135。</tspan></text></svg>