">工业落地：四种典型路线</tspan></text><rect x="374.0" y="34.0" width="93.8" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="420.9" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="420.9" dy="0.0">Industry</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">同样是“循环中段、两次为主”，起点不同、代价不同：从头训练、循环 MoE、改造已有基座、多模态产品模型</tspan></text><text x="366.0" y="132.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#5B6B7F" font-weight="700" text-anchor="start"><tspan x="366.0" dy="0.0">代表模型</tspan></text><text x="696.0" y="132.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#5B6B7F" font-weight="700" text-anchor="start"><tspan x="696.0" dy="0.0">循环结构</tspan></text><text x="996.0" y="132.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#5B6B7F" font-weight="700" text-anchor="start"><tspan x="996.0" dy="0.0">部署设计</tspan></text><text x="1286.0" y="132.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#5B6B7F" font-weight="700" text-anchor="start"><tspan x="1286.0" dy="0.0">要点</tspan></text><text x="74.0" y="210.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#1E7FD6" font-weight="700" text-anchor="start"><tspan x="74.0" dy="0.0">路线 A · 原生循环</tspan></text><text x="74.0" y="246.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24.3" fill="#1866AB" font-weight="700" text-anchor="start"><tspan x="74.0" dy="0.0">从头预训练</tspan></text><text x="366.0" y="219.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="600" text-anchor="start"><tspan x="366.0" dy="0.0">Huginn · Ouro · Nanbeige4.2 ·</tspan><tspan x="366.0" dy="30.7">Dory · ARLoop</tspan></text><path d="M664,219.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="696.0" y="219.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="696.0" dy="0.0">三段式或整栈循环</tspan><tspan x="696.0" dy="30.7">随机或固定循环数</tspan></text><path d="M964,219.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="996.0" y="231.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="996.0" dy="0.0">弹性深度 · 末轮 KV · 退出门</tspan></text><path d="M1254,219.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="1286.0" y="219.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1A6CB6" font-weight="400" text-anchor="start"><tspan x="1286.0" dy="0.0">成本：完整预训练；收益：结构</tspan><tspan x="1286.0" dy="30.7">最自由</tspan></text><text x="74.0" y="378.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#00897B" font-weight="700" text-anchor="start"><tspan x="74.0" dy="0.0">路线 B · 算力匹配胜出</tspan></text><text x="74.0" y="414.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24.3" fill="#006E62" font-weight="700" text-anchor="start"><tspan x="74.0" dy="0.0">循环 MoE</tspan></text><text x="366.0" y="387.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="600" text-anchor="start"><tspan x="366.0" dy="0.0">Loopie · SMELT · LOOM · Metis-</tspan><tspan x="366.0" dy="30.7">1.6</tspan></text><path d="M664,387.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="696.0" y="399.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="696.0" dy="0.0">层级或中段循环 ×2</tspan></text><path d="M964,387.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="996.0" y="399.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="996.0" dy="0.0">省下的内存 → 更宽 / 更多专家</tspan></text><path d="M1254,387.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="1286.0" y="387.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#007469" font-weight="400" text-anchor="start"><tspan x="1286.0" dy="0.0">在严格算力匹配下超过 vanilla</tspan><tspan x="1286.0" dy="30.7">MoE</tspan></text><text x="74.0" y="546.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#D23C77" font-weight="700" text-anchor="start"><tspan x="74.0" dy="0.0">路线 C · 继续训练</tspan></text><text x="74.0" y="582.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24.3" fill="#A8305F" font-weight="700" text-anchor="start"><tspan x="74.0" dy="0.0">改造已有基座</tspan></text><text x="366.0" y="555.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="600" text-anchor="start"><tspan x="366.0" dy="0.0">GLM-5.4 · UpLoop · Retrofitted</tspan><tspan x="366.0" dy="30.7">Recurrence</tspan></text><path d="M664,555.0 l9,6 l-9,6" fill="none" stroke="#B8C4D0" stroke-width="2"/><text x="696.0" y="543.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="696.0" dy="0.0">中段循环 ×2（GLM-5.4：28</tspan><tspan x="696.0" dy="30.7">层）</tspan><tspan x="696.0" dy="30.7">逐 token 门控渐进写回</tspan></text><path d="M964,555.0 l9,6 l-9,6" fill="n