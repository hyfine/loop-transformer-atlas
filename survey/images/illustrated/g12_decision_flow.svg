0 982,690 1000,725.0 982,760 618,760 600,725.0" fill="#F9F1DB" stroke="#D79B00" stroke-width="1.6" filter="url(#sh)"/><text x="800.0" y="731.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#8C6500" font-weight="700" text-anchor="middle"><tspan x="800.0" dy="0.0">部署约束是什么？</tspan></text><rect x="120.0" y="830.0" width="400.0" height="104.9" rx="12" fill="#EAF5EE" stroke="#8CC9A3" stroke-width="1.4"/><text x="320.0" y="861.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#206E3D" font-weight="700" text-anchor="middle"><tspan x="320.0" dy="0.0">延迟敏感</tspan></text><text x="320.0" y="894.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="320.0" dy="0.0">并行循环</tspan><tspan x="320.0" dy="24.1">自投机解码</tspan></text><rect x="600.0" y="830.0" width="400.0" height="104.9" rx="12" fill="#EAF5EE" stroke="#8CC9A3" stroke-width="1.4"/><text x="800.0" y="861.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#206E3D" font-weight="700" text-anchor="middle"><tspan x="800.0" dy="0.0">显存敏感</tspan></text><text x="800.0" y="894.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="800.0" dy="0.0">末轮 KV · KV 共享</tspan><tspan x="800.0" dy="24.1">LLA · KV 量化</tspan></text><rect x="1080.0" y="830.0" width="400.0" height="104.9" rx="12" fill="#EAF5EE" stroke="#8CC9A3" stroke-width="1.4"/><text x="1280.0" y="861.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#206E3D" font-weight="700" text-anchor="middle"><tspan x="1280.0" dy="0.0">端侧部署</tspan></text><text x="1280.0" y="894.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1280.0" dy="0.0">循环专用量化</tspan><tspan x="1280.0" dy="24.1">LoopQ · LoopVQ · ResidualQuant</tspan></text><rect x="400.0" y="1010.0" width="800.0" height="104.9" rx="12" fill="#FFFFFF" stroke="#E7CA8C" stroke-width="1.4" filter="url(#sh)"/><path d="M401.0,1022.0 a11,11 0 0 1 11,-11 h0 v102.9 h0 a11,11 0 0 1 -11,-11 z" fill="#C98A00"/><rect x="401.0" y="1011.0" width="6.0" height="102.9" rx="3" fill="#C98A00" stroke="#C98A00" stroke-width="0"/><text x="804.0" y="1041.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#976800" font-weight="700" text-anchor="middle"><tspan x="804.0" dy="0.0">后训练与安全</tspan></text><text x="804.0" y="1074.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="804.0" dy="0.0">沿潜在轨迹给奖励 + 难度课程（RLTT · Dory 的循环课程）</tspan><tspan x="804.0" dy="24.1">安全：逐个扫描循环深度，必要时做随机深度安全训练</tspan></text><rect x="640.0" y="1172.0" width="320.0" height="52.0" rx="12" fill="#2E9D57" stroke="#2E9D57" stroke-width="1.4" filter="url(#sh)"/><text x="800.0" y="1204.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="800.0" dy="0.0">上线</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">工程选型：给模型加循环深度的决策流程</tspan></text><rect x="570.0" y="34.0" width="89.4" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="614.7" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="614.7" dy="0.0">Decision</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">先由预算与基座决定“怎么得到循环模型”，再由部署约束决定“怎么把它跑起来”，最后做后训练与安全检查</tspan></text><text x="48.0" y="1282.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。数值与做法依据第 6 章各族代表工作；仅作选型参考。</tspan></text><rect x="477.5" y="241.8" width="32.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#ECC5C5" stroke-width="1"/><text x="493.5" y="261.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#C13E3E" font-weight="500" text-anchor="middle"><tspan x="493.5" dy="0.0">否</tspan></text><rect x="1090.5" y="241.8" width="32.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#BFDDCA" stroke-width="1"/><text x="1106.5" y="261.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#298D4E" font-weight="500" text-anchor="middle"><tspan x="1106.5" dy="0.0">是</tspan></text><rect x="273.0" y="436.8" width="48.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#ECC5C5" stroke-width="1"/><text x="297.0" y="456.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#C13E3E" font-weight="500" text-anchor="middle"><tspan x="297.0" dy="0.0">不能</tspan></text><rect x="466.0" y="436.8" width="32.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#BFDDCA" stroke-width="1"/><text x="482.0" y="456.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#298D4E" font-weight="500" text-anchor="middle"><tspan x="482.0" dy="0.0">能</tspan></text><rect x="1091.0" y="436.8" width="32.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#BFDDCA" stroke-width="1"/><text x="1107.0" y="456.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#298D4E" font-weight="500" text-anchor="middle"><tspan x="1107.0" dy="0.0">是</tspan></text><rect x="1276.0" y="436.6" width="32.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#ECC5C5" stroke-width="1"/><text x="1292.0" y="456.6" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#C13E3E" font-weight="500" text-anchor="middle"><tspan x="1292.0" dy="0.0">否</tspan></text></svg>