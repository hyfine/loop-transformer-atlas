="3" fill="#EF7D18" stroke="#EF7D18" stroke-width="0"/><text x="619.0" y="154.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#B35E12" font-weight="700" text-anchor="middle"><tspan x="619.0" dy="0.0">参数化 · Loop-μP</tspan></text><text x="619.0" y="187.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="619.0" dy="0.0">残差 × 1/N，学习率与循环数 N 无关</tspan></text><rect x="400.0" y="238.0" width="430.0" height="86.0" rx="12" fill="#FFFFFF" stroke="#F8C497" stroke-width="1.4" filter="url(#sh)"/><path d="M401.0,250.0 a11,11 0 0 1 11,-11 h0 v84.0 h0 a11,11 0 0 1 -11,-11 z" fill="#EF7D18"/><rect x="401.0" y="239.0" width="6.0" height="84.0" rx="3" fill="#EF7D18" stroke="#EF7D18" stroke-width="0"/><text x="619.0" y="272.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#B35E12" font-weight="700" text-anchor="middle"><tspan x="619.0" dy="0.0">归一化 · DeepLoop</tspan></text><text x="619.0" y="305.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="619.0" dy="0.0">DeepNorm 指数随循环数由 1/4 升到 1/2</tspan></text><rect x="400.0" y="356.0" width="430.0" height="86.0" rx="12" fill="#FFFFFF" stroke="#F8C497" stroke-width="1.4" filter="url(#sh)"/><path d="M401.0,368.0 a11,11 0 0 1 11,-11 h0 v84.0 h0 a11,11 0 0 1 -11,-11 z" fill="#EF7D18"/><rect x="401.0" y="357.0" width="6.0" height="84.0" rx="3" fill="#EF7D18" stroke="#EF7D18" stroke-width="0"/><text x="619.0" y="390.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#B35E12" font-weight="700" text-anchor="middle"><tspan x="619.0" dy="0.0">结构 · Fully Looped</tspan></text><text x="619.0" y="423.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="619.0" dy="0.0">循环间信号分发到所有层 + 注意力注入</tspan></text><rect x="400.0" y="474.0" width="430.0" height="86.0" rx="12" fill="#FFFFFF" stroke="#F8C497" stroke-width="1.4" filter="url(#sh)"/><path d="M401.0,486.0 a11,11 0 0 1 11,-11 h0 v84.0 h0 a11,11 0 0 1 -11,-11 z" fill="#EF7D18"/><rect x="401.0" y="475.0" width="6.0" height="84.0" rx="3" fill="#EF7D18" stroke="#EF7D18" stroke-width="0"/><text x="619.0" y="508.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#B35E12" font-weight="700" text-anchor="middle"><tspan x="619.0" dy="0.0">目标 · 不动点 / 吸引子</tspan></text><text x="619.0" y="541.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="619.0" dy="0.0">STARS 谱半径正则 · Attractor 隐式微分</tspan></text><rect x="400.0" y="592.0" width="430.0" height="104.9" rx="12" fill="#FFFFFF" stroke="#F8C497" stroke-width="1.4" filter="url(#sh)"/><path d="M401.0,604.0 a11,11 0 0 1 11,-11 h0 v102.9 h0 a11,11 0 0 1 -11,-11 z" fill="#EF7D18"/><rect x="401.0" y="593.0" width="6.0" height="102.9" rx="3" fill="#EF7D18" stroke="#EF7D18" stroke-width="0"/><text x="619.0" y="623.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#B35E12" font-weight="700" text-anchor="middle"><tspan x="619.0" dy="0.0">反馈 · 插值 / 门控写回</tspan></text><text x="619.0" y="656.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="619.0" dy="0.0">Rectified Looped Transformer · GLM-5.4 门控渐进</tspan><tspan x="619.0" dy="24.1">更新</tspan></text><polygon points="928,470 1112,470 1130,499.365 1112,528.73 928,528.73 910,499.365" fill="#F9F1DB" stroke="#D79B00" stroke-width="1.6" filter="url(#sh)"/><text x="1020.0" y="505.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#8C6500" font-weight="700" text-anchor="middle"><tspan x="1020.0" dy="0.0">算子类型？</tspan></text><rect x="1190.0" y="380.0" width="260.0" height="80.8" rx="12" fill="#EAF5EE" stroke="#8CC9A3" stroke-width="1.4"/><text x="1320.0" y="411.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#206E3D" font-weight="700" text-anchor="middle"><tspan x="1320.0" dy="0.0">settling</tspan></text><text x="1320.0" y="444.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1320.0" dy="0.0">加深不退化，可外推</tspan></text><rect x="1190.0" y="560.0" width="260.0" height="80.8" rx="12" fill="#FBECEC" stroke="#E89999" stroke-width="1.4"/><text x="1320.0" y="591.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#963030" font-weight="700" text-anchor="middle"><tspan x="1320.0" dy="0.0">drifting</tspan></text><text x="1320.0" y="624.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1320.0" dy="0.0">加深会漂移 → 需要不动点目标</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">F05 · 训练稳定性：让“越算越好”而不是“先升后崩”</tspan></text><rect x="768.8" y="34.0" width="84.4" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="811.0" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="811.0" dy="0.0">机制流程</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">五类处方针对同一个问题；是否需要不动点目标，取决于算子是 settling 还是 drifting</tspan></text><text x="910.0" y="160.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="700" text-anchor="start"><tspan x="910.0" dy="0.0">Think Shallow, Solve Deep（2026）</tspan></text><text x="910.0" y="186.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="910.0" dy="0.0">把算子分为 settling / marginal / drifting，</tspan><tspan x="910.0" dy="26.9">判断“额外深度”是否安全；</tspan><tspan x="910.0" dy="26.9">Huginn 属于非 settling 类。</tspan></text><text x="48.0" y="742.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。依据：arXiv 2606.18524、2607.13491、2605.18797、2605.26733、2605.12466、2608.18222、2611.16265。</tspan></text></svg>