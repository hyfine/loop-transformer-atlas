05.0 1092,247.73 898,247.73 880,205.0" fill="#F9F1DB" stroke="#D79B00" stroke-width="1.6" filter="url(#sh)"/><text x="995.0" y="197.7" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#8C6500" font-weight="700" text-anchor="middle"><tspan x="995.0" dy="0.0">累计停机概率</tspan><tspan x="995.0" dy="26.7">≥ 1 − ε ？</tspan></text><rect x="1160.0" y="164.6" width="290.0" height="80.8" rx="12" fill="#FFFFFF" stroke="#A9B1DE" stroke-width="1.4" filter="url(#sh)"/><path d="M1161.0,176.6 a11,11 0 0 1 11,-11 h0 v78.8 h0 a11,11 0 0 1 -11,-11 z" fill="#3F51B5"/><rect x="1161.0" y="165.6" width="6.0" height="78.8" rx="3" fill="#3F51B5" stroke="#3F51B5" stroke-width="0"/><text x="1309.0" y="196.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#2F3D88" font-weight="700" text-anchor="middle"><tspan x="1309.0" dy="0.0">加权汇总各步状态 → 输出</tspan></text><text x="1309.0" y="229.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1309.0" dy="0.0">权重 = 各步停机概率</tspan></text><rect x="820.0" y="370.0" width="400.0" height="80.8" rx="12" fill="#FFFFFF" stroke="#8C97D3" stroke-width="1.4" stroke-dasharray="6 5"/><text x="1020.0" y="401.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#2F3D88" font-weight="700" text-anchor="middle"><tspan x="1020.0" dy="0.0">DEQ：直接求不动点 h* = F(h*, x)</tspan></text><text x="1020.0" y="434.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1020.0" dy="0.0">隐式微分：显存与“深度”无关</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">F01 · 奠基与前身：共享深度 + 自适应停机</tspan></text><rect x="605.1" y="34.0" width="84.4" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="647.3" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="647.3" dy="0.0">机制流程</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">同一组参数沿“步”反复作用；每个位置自己决定算多少步；DEQ 则直接求不动点</tspan></text><text x="48.0" y="330.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#1E2A36" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">UT 的两个关键：</tspan></text><text x="48.0" y="356.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">① 所有位置并行、参数在步间共享</tspan><tspan x="48.0" dy="28.2">② ACT 让每个位置独立停机</tspan></text><text x="48.0" y="499.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#5B6B7F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">代表工作</tspan></text><rect x="133.1" y="480.0" width="157.3" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="211.7" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="211.7" dy="0.0">Neural GPU 2015</tspan></text><rect x="300.4" y="480.0" width="98.7" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="349.7" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="349.7" dy="0.0">ACT 2016</tspan></text><rect x="409.1" y="480.0" width="255.4" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="536.8" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="536.8" dy="0.0">Universal Transformer 2018</tspan></text><rect x="674.5" y="480.0" width="98.7" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="723.8" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="723.8" dy="0.0">DEQ 2019</tspan></text><rect x="783.1" y="480.0" width="131.3" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="848.8" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="848.8" dy="0.0">ALBERT 2019</tspan></text><rect x="924.5" y="480.0" width="178.7" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="1013.8" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="1013.8" dy="0.0">Deep Thinking 2021</tspan></text><rect x="1113.2" y="480.0" width="150.0" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="1188.2" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="1188.2" dy="0.0">PonderNet 2021</tspan></text><rect x="1273.2" y="480.0" width="122.7" height="27.0" rx="13.5" fill="#E8EAF6" stroke="#B2B9E1" stroke-width="1"/><text x="1334.5" y="499.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#324191" font-weight="600" text-anchor="middle"><tspan x="1334.5" dy="0.0">MoEUT 2024</tspan></text><text x="48.0" y="582.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。依据：arXiv 1807.03819（UT）、1603.08983（ACT）、1909.01377（DEQ）、2107.05407（PonderNet）。</tspan></text><rect x="1095.0" y="189.8" width="80.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#BFDDCA" stroke-width="1"/><text x="1135.0" y="209.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#298D4E" font-weight="500" text-anchor="middle"><tspan x="1135.0" dy="0.0">是：停机</tspan></text><rect x="705.1" y="314.8" width="269.8" height="30.4" rx="8" fill="#FFFFFF" stroke="#F1D6BE" stroke-width="1"/><text x="840.0" y="334.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#D17526" font-weight="500" text-anchor="middle"><tspan x="840.0" dy="0.0">否：再算一步（ACT / PonderNet）</tspan></text><rect x="1257.0" y="314.2" width="96.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#CBCFD5" stroke-width="1"/><text x="1305.0" y="334.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#526072" font-weight="500" text-anchor="middle"><tspan x="1305.0" dy="0.0">另一条路线</tspan></text></svg>