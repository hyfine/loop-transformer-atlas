<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960"><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#1F3A5F" flood-opacity="0.10"/></filter><marker id="m5B6B7F" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 Q2.6,5 0.5,0.8 z" fill="#5B6B7F"/></marker></defs><rect width="1500" height="960" fill="#FFFFFF"/><rect x="260.0" y="130.0" width="340.0" height="340.0" rx="0" fill="#F2F6FB" stroke="#D5DDE6" stroke-width="0"/><rect x="600.0" y="130.0" width="340.0" height="340.0" rx="0" fill="#E8F5EF" stroke="#D5DDE6" stroke-width="0"/><rect x="260.0" y="470.0" width="340.0" height="340.0" rx="0" fill="#FBF4EA" stroke="#D5DDE6" stroke-width="0"/><rect x="600.0" y="470.0" width="340.0" height="340.0" rx="0" fill="#FCEDED" stroke="#D5DDE6" stroke-width="0"/><rect x="260.0" y="130.0" width="680.0" height="680.0" rx="0" fill="none" stroke="#C5D0DC" stroke-width="1.4"/><line x1="48.0" y1="918.0" x2="1452.0" y2="918.0" stroke="#E6EBF0" stroke-width="1"/><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">代表性工作的定性定位：训练成本 × 推理友好度</tspan></text><rect x="669.7" y="34.0" width="51.2" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="695.3" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="695.3" dy="0.0">定性</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">坐标为本文的主观判断，仅用于直观比较，不是量化测量</tspan></text><text x="276.0" y="160.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.2" fill="#2F6FB3" font-weight="700" text-anchor="start"><tspan x="276.0" dy="0.0">低成本 · 好部署</tspan></text><text x="924.0" y="160.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.2" fill="#2E9D57" font-weight="700" text-anchor="end"><tspan x="924.0" dy="0.0">原生循环 · 已优化推理</tspan></text><text x="276.0" y="794.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.2" fill="#B7791F" font-weight="700" text-anchor="start"><tspan x="276.0" dy="0.0">低成本 · 推理贵</tspan></text><text x="924.0" y="794.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.2" fill="#D64545" font-weight="700" text-anchor="end"><tspan x="924.0" dy="0.0">高成本 · 推理贵</tspan></text><line x1="260.0" y1="844.0" x2="940.0" y2="844.0" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#m5B6B7F)"/><text x="600.0" y="872.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.9" fill="#5B6B7F" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">训练成本：低 → 高</tspan></text><line x1="226" y1="810" x2="226" y2="130" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#m5B6B7F)"/><text x="208" y="470.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.92" fill="#5B6B7F" font-weight="700" text-anchor="middle" transform="rotate(-90 208 470.0)">推理友好度：低 → 高</text><circle cx="341.6" cy="619.6" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="357.6" y="617.6" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="357.6" dy="0.0">Training-Free</tspan></text><text x="357.6" y="637.6" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="357.6" dy="0.0">免训练包装，推理多算 K 步</tspan></text><circle cx="491.2" cy="578.8" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="507.2" y="576.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="507.2" dy="0.0">UpLoop</tspan></text><text x="507.2" y="596.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="507.2" dy="0.0">门控改造 + SFT</tspan></text><circle cx="613.6" cy="266.0" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="597.6" y="264.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="end"><tspan x="597.6" dy="0.0">GLM-5.4</tspan></text><text x="597.6" y="284.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="end"><tspan x="597.6" dy="0.0">混合 KV + 稀疏索引复用</tspan></text><circle cx="668.0" cy="402.0" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="652.0" y="400.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="end"><tspan x="652.0" dy="0.0">SenseNova-Loop</tspan></text><text x="652.0" y="420.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="end"><tspan x="652.0" dy="0.0">中段 ×2 + 线性注意力</tspan></text><circle cx="749.6" cy="211.6" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="765.6" y="209.6" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="765.6" dy="0.0">MoLT</tspan></text><text x="765.6" y="229.6" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="765.6" dy="0.0">延迟与非循环持平</tspan></text><circle cx="817.6" cy="306.8" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="801.6" y="304.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="end"><tspan x="801.6" dy="0.0">Dory</tspan></text><text x="801.6" y="324.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="end"><tspan x="801.6" dy="0.0">只缓存末轮 KV</tspan></text><circle cx="872.0" cy="374.8" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="856.0" y="372.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="end"><tspan x="856.0" dy="0.0">LoopCoder-v2</tspan></text><text x="856.0" y="392.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="end"><tspan x="856.0" dy="0.0">PLT 并行循环</tspan></text><circle cx="722.4" cy="701.2" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="738.4" y="699.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="738.4" dy="0.0">Huginn</tspan></text><text x="738.4" y="719.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="738.4" dy="0.0">r̄=32，串行 + 每轮 KV</tspan></text><circle cx="790.4" cy="578.8" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="806.4" y="576.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="806.4" dy="0.0">Ouro</tspan></text><text x="806.4" y="596.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="806.4" dy="0.0">R=4 + 退出门</tspan></text><circle cx="885.6" cy="633.2" r="9" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2.5"/><text x="869.6" y="631.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18.6" fill="#1F3A5F" font-weight="700" text-anchor="end"><tspan x="869.6" dy="0.0">Loopie</tspan></text><text x="869.6" y="651.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.4" fill="#5B6B7F" font-weight="400" text-anchor="end"><tspan x="869.6" dy="0.0">2 次循环，推理 ≈ 2×</tspan></text><text x="1010.0" y="160.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20.5" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="1010.0" dy="0.0">怎么读这张图</tspan></text><rect x="1010.0" y="196.0" width="50.0" height="27.0" rx="13.5" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="1035.0" y="215.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="1035.0" dy="0.0">右上</tspan></text><text x="1072.0" y="214.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="1072.0" dy="0.0">原生循环 + 推理侧专门设计：MoLT、Dory、</tspan><tspan x="1072.0" dy="28.2">GLM-5.4 代表 2026 下半年的方向</tspan></text><rect x="1010.0" y="270.0" width="50.0" height="27.0" rx="13.5" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="1035.0" y="289.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="1035.0" dy="0.0">右下</tspan></text><text x="1072.0" y="288.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="1072.0" dy="0.0">训练贵、推理也贵：早期规模化工作（Huginn、</tspan><tspan x="1072.0" dy="28.2">Ouro）和纯 MoE 循环</tspan></text><rect x="1010.0" y="344.0" width="50.0" height="27.0" rx="13.5" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="1035.0" y="363.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="1035.0" dy="0.0">左下</tspan></text><text x="1072.0" y="362.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="1072.0" dy="0.0">改造便宜，但推理要多算：Training-Free、</tspan><tspan x="1072.0" dy="28.2">UpLoop</tspan></text><rect x="1010.0" y="418.0" width="50.0" height="27.0" rx="13.5" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1"/><text x="1035.0" y="437.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="1035.0" dy="0.0">趋势</tspan></text><text x="1072.0" y="436.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17.3" fill="#1E2A36" font-weight="400" text-anchor="start"><tspan x="1072.0" dy="0.0">工作整体从右下向右上迁移 —— 推理成本已成</tspan><tspan x="1072.0" dy="28.2">为循环模型的第一约束</tspan></text><text x="48.0" y="942.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。定性判断依据各论文 / 报告对训练预算与推理开销的自述。</tspan></text></svg>