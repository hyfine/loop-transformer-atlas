762.8,456.0 Q765.0,456.0 765.0,458.2 L765.0,458.2 Q765.0,460.4 767.2,460.4 L797.0,460.4" fill="none" stroke="#6A4FB6" stroke-width="1.8" marker-end="url(#m6A4FB6)" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.0,355.8 L325.0,355.8 Q335.0,355.8 335.0,365.8 L335.0,590.4 Q335.0,600.4 345.0,600.4 L367.0,600.4" fill="none" stroke="#9784CC" stroke-width="1.8" marker-end="url(#m9784CC)" stroke-linecap="round" stroke-linejoin="round"/><path d="M733.0,600.4 L759.0,600.4 Q765.0,600.4 765.0,606.5 L765.0,606.5 Q765.0,612.5 771.0,612.5 L797.0,612.5" fill="none" stroke="#6A4FB6" stroke-width="1.8" marker-end="url(#m6A4FB6)" stroke-linecap="round" stroke-linejoin="round"/><rect x="48.0" y="290.0" width="250.0" height="131.6" rx="12" fill="#6A4FB6" stroke="#6A4FB6" stroke-width="1.4" filter="url(#sh)"/><text x="173.0" y="323.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21.8" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="173.0" dy="0.0">核心问题</tspan></text><text x="173.0" y="359.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#E4DFF2" font-weight="400" text-anchor="middle"><tspan x="173.0" dy="0.0">k 层循环 L 次</tspan><tspan x="173.0" dy="24.1">vs</tspan><tspan x="173.0" dy="24.1">kL 层独立网络</tspan></text><rect x="370.0" y="128.0" width="360.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#BCB0DE" stroke-width="1.4" filter="url(#sh)"/><path d="M371.0,140.0 a11,11 0 0 1 11,-11 h0 v94.0 h0 a11,11 0 0 1 -11,-11 z" fill="#6A4FB6"/><rect x="371.0" y="129.0" width="6.0" height="94.0" rx="3" fill="#6A4FB6" stroke="#6A4FB6" stroke-width="0"/><text x="554.0" y="167.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#503B88" font-weight="700" text-anchor="middle"><tspan x="554.0" dy="0.0">表达力</tspan></text><text x="554.0" y="200.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="554.0" dy="0.0">可编程计算机；能模拟 T 步 CoT</tspan></text><rect x="800.0" y="128.0" width="650.0" height="128.9" rx="12" fill="#F0EDF8" stroke="#AD9ED7" stroke-width="1.4"/><text x="1125.0" y="159.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#4A377F" font-weight="700" text-anchor="middle"><tspan x="1125.0" dy="0.0">循环 ↔ CoT 互补</tspan></text><text x="1125.0" y="192.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1125.0" dy="0.0">循环：擅长并行、确定性的计算（如 DAG 求值）</tspan><tspan x="1125.0" dy="24.1">CoT：擅长自归约问题的近似推断</tspan><tspan x="1125.0" dy="24.1">— To CoT or To Loop?（2025）</tspan></text><rect x="370.0" y="268.0" width="360.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#BCB0DE" stroke-width="1.4" filter="url(#sh)"/><path d="M371.0,280.0 a11,11 0 0 1 11,-11 h0 v94.0 h0 a11,11 0 0 1 -11,-11 z" fill="#6A4FB6"/><rect x="371.0" y="269.0" width="6.0" height="94.0" rx="3" fill="#6A4FB6" stroke="#6A4FB6" stroke-width="0"/><text x="554.0" y="307.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#503B88" font-weight="700" text-anchor="middle"><tspan x="554.0" dy="0.0">学习性</tspan></text><text x="554.0" y="340.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="554.0" dy="0.0">上下文学习中学到多步梯度下降</tspan></text><rect x="800.0" y="268.0" width="650.0" height="104.9" rx="12" fill="#F0EDF8" stroke="#AD9ED7" stroke-width="1.4"/><text x="1125.0" y="299.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#4A377F" font-weight="700" text-anchor="middle"><tspan x="1125.0" dy="0.0">循环天然适合“迭代算法”</tspan></text><text x="1125.0" y="332.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1125.0" dy="0.0">同一块反复执行 ≈ 优化器的一步更新</tspan><tspan x="1125.0" dy="24.1">— Looped TF Learn Learning Algorithms（2023）</tspan></text><rect x="370.0" y="408.0" width="360.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#BCB0DE" stroke-width="1.4" filter="url(#sh)"/><path d="M371.0,420.0 a11,11 0 0 1 11,-11 h0 v94.0 h0 a11,11 0 0 1 -11,-11 z" fill="#6A4FB6"/><rect x="371.0" y="409.0" width="6.0" height="94.0" rx="3" fill="#6A4FB6" stroke="#6A4FB6" stroke-width="0"/><text x="554.0" y="447.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#503B88" font-weight="700" text-anchor="middle"><tspan x="554.0" dy="0.0">泛化</tspan></text><text x="554.0" y="480.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="554.0" dy="0.0">按输入长度自适应迭代次数</tspan></text><rect x="800.0" y="408.0" width="650.0" height="104.9" rx="12" fill="#F0EDF8" stroke="#AD9ED7" stroke-width="1.4"/><text x="1125.0" y="439.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#4A377F" font-weight="700" text-anchor="middle"><tspan x="1125.0" dy="0.0">长度外推</tspan></text><text x="1125.0" y="472.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1125.0" dy="0.0">训练短、测试长：迭代次数随问题规模增长</tspan><tspan x="1125.0" dy="24.1">— Looped TF for Length Generalization（2024）</tspan></text><rect x="370.0" y="548.0" width="360.0" height="104.9" rx="12" fill="#FFFFFF" stroke="#BCB0DE" stroke-width="1.4" filter="url(#sh)"/><path d="M371.0,560.0 a11,11 0 0 1 11,-11 h0 v102.9 h0 a11,11 0 0 1 -11,-11 z" fill="#6A4FB6"/><rect x="371.0" y="549.0" width="6.0" height="102.9" rx="3" fill="#6A4FB6" stroke="#6A4FB6" stroke-width="0"/><text x="554.0" y="579.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#503B88" font-weight="700" text-anchor="middle"><tspan x="554.0" dy="0.0">扩展律</tspan></text><text x="554.0" y="612.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="554.0" dy="0.0">L = E + A·(N_once + r^φ·N_rec)^−α</tspan><tspan x="554.0" dy="24.1">+ B·D^−β</tspan></text><rect x="800.0" y="548.0" width="650.0" height="128.9" rx="12" fill="#F0EDF8" stroke="#AD9ED7" stroke-width="1.4"/><text x="1125.0" y="579.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#4A377F" font-weight="700" text-anchor="middle"><tspan x="1125.0" dy="0.0">φ ≈ 0.46：一次循环 ≈ r^0.46 份参数</tspan></text><text x="1125.0" y="612.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1125.0" dy="0.0">FLOPs 匹配下用循环替换独立层会亏；</tspan><tspan x="1125.0" dy="24.1">收益来自把省下的内存 / 参数换成宽度或专家</tspan><tspan x="1125.0" dy="24.1">— Iso-Depth Scaling Law（2026）</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">F02 · 理论：循环到底“买到”了什么</tspan></text><rect x="544.8" y="34.0" width="84.4" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="587.0" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="587.0" dy="0.0">机制流程</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">四个理论问题，以及它们对工程设计的直接含义</tspan></text><text x="48.0" y="702.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。依据：arXiv 2301.13196、2311.12424、2409.15647、2502.17416、2505.19245、2604.21106。</tspan></text><rect x="757.0" y="177.3" width="48.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#CFC8E4" stroke-width="1"/><text x="781.0" y="197.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#5F47A4" font-weight="500" text-anchor="middle"><tspan x="781.0" dy="0.0">含义</tspan></text><rect x="757.0" y="305.2" width="48.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#CFC8E4" stroke-width="1"/><text x="781.0" y="325.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#5F47A4" font-weight="500" text-anchor="middle"><tspan x="781.0" dy="0.0">含义</tspan></text><rect x="757.0" y="445.2" width="48.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#CFC8E4" stroke-width="1"/><text x="781.0" y="465.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#5F47A4" font-weight="500" text-anchor="middle"><tspan x="781.0" dy="0.0">含义</tspan></text><rect x="757.0" y="597.3" width="48.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#CFC8E4" stroke-width="1"/><text x="781.0" y="617.3" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#5F47A4" font-weight="500" text-anchor="middle"><tspan x="781.0" dy="0.0">含义</tspan></text></svg>