nchor="start"><tspan x="402.0" dy="0.0">LoOPSD：以循环版自身为教师做在策略自蒸馏</tspan><tspan x="402.0" dy="24.1">ELGO：外推末轮教师给稠密逐 token 信号</tspan></text><rect x="380.0" y="253.0" width="700.0" height="104.9" rx="12" fill="#FFFFFF" stroke="#E7CA8C" stroke-width="1.4" filter="url(#sh)"/><path d="M381.0,265.0 a11,11 0 0 1 11,-11 h0 v102.9 h0 a11,11 0 0 1 -11,-11 z" fill="#C98A00"/><rect x="381.0" y="254.0" width="6.0" height="102.9" rx="3" fill="#C98A00" stroke="#C98A00" stroke-width="0"/><text x="402.0" y="284.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#976800" font-weight="700" text-anchor="start"><tspan x="402.0" dy="0.0">强化学习</tspan></text><text x="402.0" y="317.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="402.0" dy="0.0">GRPO 只奖励末态 ✗</tspan><tspan x="402.0" dy="24.1">RLTT：沿潜在轨迹分配奖励 · LoopRPT：潜在步强化预训练</tspan></text><rect x="380.0" y="388.0" width="700.0" height="104.9" rx="12" fill="#FFFFFF" stroke="#E7CA8C" stroke-width="1.4" filter="url(#sh)"/><path d="M381.0,400.0 a11,11 0 0 1 11,-11 h0 v102.9 h0 a11,11 0 0 1 -11,-11 z" fill="#C98A00"/><rect x="381.0" y="389.0" width="6.0" height="102.9" rx="3" fill="#C98A00" stroke="#C98A00" stroke-width="0"/><text x="402.0" y="419.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#976800" font-weight="700" text-anchor="start"><tspan x="402.0" dy="0.0">潜在 CoT 监督</tspan></text><text x="402.0" y="452.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="402.0" dy="0.0">LOTUS：金标 CoT token 监督各潜位</tspan><tspan x="402.0" dy="24.1">LoopMTP：第 t 轮对齐 t 步之后的 token</tspan></text><rect x="380.0" y="523.0" width="700.0" height="104.9" rx="12" fill="#FFFFFF" stroke="#E7CA8C" stroke-width="1.4" filter="url(#sh)"/><path d="M381.0,535.0 a11,11 0 0 1 11,-11 h0 v102.9 h0 a11,11 0 0 1 -11,-11 z" fill="#C98A00"/><rect x="381.0" y="524.0" width="6.0" height="102.9" rx="3" fill="#C98A00" stroke="#C98A00" stroke-width="0"/><text x="402.0" y="554.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#976800" font-weight="700" text-anchor="start"><tspan x="402.0" dy="0.0">安全</tspan></text><text x="402.0" y="587.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="402.0" dy="0.0">降深度会削弱拒答（半深度有害协助率升 5.3×）</tspan><tspan x="402.0" dy="24.1">→ 随机深度安全训练 / 跨深度对齐</tspan></text><rect x="1180.0" y="300.0" width="270.0" height="83.5" rx="12" fill="#EAF5EE" stroke="#8CC9A3" stroke-width="1.4"/><text x="1315.0" y="333.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21.8" fill="#206E3D" font-weight="700" text-anchor="middle"><tspan x="1315.0" dy="0.0">对齐后的循环模型</tspan></text><text x="1315.0" y="369.1" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1315.0" dy="0.0">每个深度都可用、可控</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">F09 · 后训练、强化学习与安全</tspan></text><rect x="460.8" y="34.0" width="84.4" height="27.6" rx="13.8" fill="#1E9E8F" stroke="#1E9E8F" stroke-width="1"/><text x="503.0" y="53.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="503.0" dy="0.0">机制流程</tspan></text><text x="48.0" y="90.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#5B6B7F" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">标准 GRPO 只给最终潜状态记功；对齐必须覆盖每一个循环深度</tspan></text><text x="48.0" y="702.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。依据：arXiv 2610.18162、2611.31939、2602.10520、2603.19714、2606.31779、2608.03624、2610.15218。</tspan></text></svg>