o Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1039.0" dy="0.0">为每个输入生成跳过 / 重复哪些层</tspan><tspan x="1039.0" dy="24.1">Program-of-Layers</tspan></text><rect x="1240.0" y="400.0" width="210.0" height="131.6" rx="12" fill="#FAECF1" stroke="#E694B4" stroke-width="1.4"/><text x="1345.0" y="431.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#932A53" font-weight="700" text-anchor="middle"><tspan x="1345.0" dy="0.0">门控渐进写回</tspan><tspan x="1345.0" dy="26.7">+ KV 复用</tspan></text><text x="1345.0" y="491.2" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1345.0" dy="0.0">防范数爆炸</tspan><tspan x="1345.0" dy="24.1">控制部署成本</tspan></text><rect x="1240.0" y="140.0" width="210.0" height="104.9" rx="12" fill="#FBECEC" stroke="#E89999" stroke-width="1.4"/><text x="1345.0" y="171.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#963030" font-weight="700" text-anchor="middle"><tspan x="1345.0" dy="0.0">评估</tspan></text><text x="1345.0" y="204.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="1345.0" dy="0.0">是否值回</tspan><tspan x="1345.0" dy="24.1">推理算力？</tspan></text><rect x="48.0" y="690.0" width="1402.0" height="80.8" rx="10" fill="#FFF8E6" stroke="#F1D28A" stroke-width="1.2"/><text x="749.0" y="721.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#7A5200" font-weight="700" text-anchor="middle"><tspan x="749.0" dy="0.0">There Is No Free Loop（2026）</tspan></text><text x="749.0" y="754.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#8A6A2A" font-weight="400" text-anchor="middle"><tspan x="7