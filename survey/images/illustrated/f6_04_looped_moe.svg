xt><text x="48.0" y="582.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#8A97A6" font-weight="400" text-anchor="start"><tspan x="48.0" dy="0.0">本文绘制。依据：arXiv 2607.16051、2609.01343、2610.01153、2609.35751、2611.33952、2606.16825。</tspan></text><rect x="1281.5" y="184.8" width="32.0" height="30.4" rx="8" fill="#FFFFFF" stroke="#BFDDCA" stroke-width="1"/><text x="1297.5" y="204.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#298D4E" font-weight="500" text-anchor="middle"><tspan x="1297.5" dy="0.0">否</tspan></text><rect x="631.0" y="294.8" width="218.1" height="30.4" rx="8" fill="#FFFFFF" stroke="#F1D6BE" stroke-width="1"/><text x="740.0" y="314.8" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.0" fill="#D17526" font-weight="500" text-anchor="middle"><tspan x="740.0" dy="0.0">是：同一层再算一次（×2）</tspan></text></svg>