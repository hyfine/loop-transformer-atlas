rosoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#006056" font-weight="700" text-anchor="middle"><tspan x="905.0" dy="0.0">Experts 专家池</tspan></text><text x="905.0" y="212.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#5B6B7F" font-weight="400" text-anchor="middle"><tspan x="905.0" dy="0.0">共享（Tying the Loop）</tspan><tspan x="905.0" dy="24.1">展平（Foil）</tspan></text><polygon points="1088,170.635 1252,170.635 1270,200.0 1252,229.365 1088,229.365 1070,200.0" fill="#F9F1DB" stroke="#D79B00" stroke-width="1.6" filter="url(#sh)"/><text x="1170.0" y="206.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#8C6500" font-weight="700" text-anchor="middle"><tspan x="1170.0" dy="0.0">本层再来一次？</tspan></text><rect x="1325.0" y="174.6" width="125.0" height="50.7" rx="12" fill="#FFFFFF" stroke="#66B8B0" stroke-width="1.4" stroke-dasharray="6 5"/><text x="1387.5" y="206.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#00675C" font-weight="700" text-anchor="middle"><tspan x="1387.5" dy="0.0">下一层</tspan></text><rect x="640.0" y="370.0" width="810.0" height="80.8" rx="10" fill="#FFF8E6" stroke="#F1D28A" stroke-width="1.2"/><text x="1045.0" y="401.4" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19.8" fill="#7A5200" font-weight="700" text-anchor="middle"><tspan x="1045.0" dy="0.0">把省下的激活内存 / 参数换成：更大 micro-batch · 更宽 · 更多专家</tspan></text><text x="1045.0" y="434.5" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16.6" fill="#8A6A2A" font-weight="400" text-anchor="middle"><tspan x="1045.0" dy="0.0">Loopie 以实测 step 时间匹配算力；SMELT 同时匹配 FLOPs / 参数 / KV</tspan></text><text x="48.0" y="58.0" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#1F3A5F" font-weight="700" text-anchor="start"><tspan x="48.0" dy="0.0">F04 · 循环 