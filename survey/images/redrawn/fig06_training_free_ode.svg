<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><defs><marker id="ah1F3A5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="ah2BB3A3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2BB3A3"/></marker><marker id="ah1C8577" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C8577"/></marker><marker id="ahEE8A2A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EE8A2A"/></marker><marker id="ah5B6B7F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/></marker><marker id="ahD64545" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ah3A6EA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker><marker id="ah22313F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313F"/></marker></defs><rect width="1200" height="620" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="26" fill="#1F3A5F" font-weight="bold" text-anchor="start">免训练循环：把“整步重复”改成“细分子步”</text>
<text x="40" y="82" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="15" fill="#5B6B7F" font-weight="normal" text-anchor="start">把 pre-norm 残差块看成 ODE 的一次前向欧拉步；循环 = 对同一近似做细化，而不是再走一整步</text>
<rect x="40" y="108" width="640" height="470" rx="14" fill="#FFFFFF" stroke="#C7D1DC" stroke-width="1.2"/>
<text x="60" y="138" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start">隐状态轨迹（二维示意）</text>
<path d="M 100.0 480.0 L 109.4 478.3 L 118.8 476.3 L 128.1 474.0 L 137.5 471.3 L 146.9 468.3 L 156.2 464.9 L 165.6 461.2 L 175.0 457.2 L 184.4 452.8 L 193.8 448.1 L 203.1 443.1 L 212.5 437.7 L 221.9 432.0 L 231.2 425.9 L 240.6 419.5 L 250.0 412.8 L 259.4 405.7 L 268.8 398.3 L 278.1 390.6 L 287.5 382.5 L 296.9 374.1 L 306.2 365.3 L 315.6 356.2 L 325.0 346.8 L 334.4 337.0 L 343.8 326.9 L 353.1 316.5 L 362.5 305.7 L 371.9 294.6 L 381.2 283.1 L 390.6 271.3 L 400.0 259.2 L 409.4 246.7 L 418.8 233.9 L 428.1 220.8 L 437.5 207.3 L 446.9 193.5 L 456.2 179.3 L 465.6 164.8 L 475.0 150.0" fill="none" stroke="#2BB3A3" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
<text x="486" y="146" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#1C8577" font-weight="normal" text-anchor="start">潜在的连续流 dh/dt = f(h)</text>
<line x1="100" y1="480" x2="345" y2="441" stroke="#5B6B7F" stroke-width="2.6" marker-end="url(#ah5B6B7F)"/>
<circle cx="100" cy="480" r="7" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="92" y="508" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">hₗ（第 l 层输入）</text>
<circle cx="350" cy="440" r="7" fill="#5B6B7F" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="250" y="506" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#5B6B7F" font-weight="normal" text-anchor="start">原模型：一层 = 一个大步</text>
<line x1="350" y1="440" x2="594" y2="401" stroke="#D64545" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ahD64545)"/>
<circle cx="600" cy="400" r="7" fill="#D64545" stroke="#D64545" stroke-width="1.5"/>
<text x="452" y="452" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13" fill="#D64545" font-weight="bold" text-anchor="start">朴素重复：再走一整步</text>
<text x="452" y="471" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#D64545" font-weight="normal" text-anchor="start">越走越远，常见掉点</text>
<line x1="100" y1="480" x2="174.97" y2="468.03" stroke="#1C8577" stroke-width="2.6" marker-end="url(#ah1C8577)"/>
<line x1="183.3" y1="466.7" x2="258.36" y2="430.7" stroke="#1C8577" stroke-width="2.6" marker-end="url(#ah1C8577)"/>
<line x1="266.7" y1="426.7" x2="341.67" y2="366.67" stroke="#1C8577" stroke-width="2.6" marker-end="url(#ah1C8577)"/>
<circle cx="183.3" cy="466.7" r="5.5" fill="#2BB3A3" stroke="#2BB3A3" stroke-width="1.5"/>
<circle cx="266.7" cy="426.7" r="5.5" fill="#2BB3A3" stroke="#2BB3A3" stroke-width="1.5"/>
<circle cx="350" cy="360" r="5.5" fill="#2BB3A3" stroke="#2BB3A3" stroke-width="1.5"/>
<text x="364" y="352" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13" fill="#1C8577" font-weight="bold" text-anchor="start">K 个子步（带阻尼）：</text>
<text x="364" y="371" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#1C8577" font-weight="normal" text-anchor="start">每步重新计算 f，更贴近连续流</text>
<line x1="70" y1="548" x2="104" y2="548" stroke="#5B6B7F" stroke-width="2.6" marker-end="url(#ah5B6B7F)"/>
<text x="112" y="553" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#22313F" font-weight="normal" text-anchor="start">原始一步</text>
<line x1="200" y1="548" x2="234" y2="548" stroke="#D64545" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ahD64545)"/>
<text x="242" y="553" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#22313F" font-weight="normal" text-anchor="start">朴素重复</text>
<line x1="330" y1="548" x2="364" y2="548" stroke="#1C8577" stroke-width="2.6" marker-end="url(#ah1C8577)"/>
<text x="372" y="553" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#22313F" font-weight="normal" text-anchor="start">K 个子步</text>
<line x1="460" y1="548" x2="494" y2="548" stroke="#2BB3A3" stroke-width="2" stroke-dasharray="3 6"/>
<text x="502" y="553" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#22313F" font-weight="normal" text-anchor="start">潜在连续流</text>
<rect x="700" y="108" width="460" height="140" rx="14" fill="#EAF1FB" stroke="#B8CBE3" stroke-width="1.2"/>
<text x="720" y="138" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start">视角</text>
<text x="720" y="166" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="14" fill="#22313F" font-weight="normal" text-anchor="start">pre-norm 块：hₗ₊₁ = hₗ + fₗ(hₗ)</text>
<text x="720" y="192" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="14" fill="#22313F" font-weight="normal" text-anchor="start">≈ 对 dh/dt = f(h) 做步长为 1 的前向欧拉</text>
<text x="720" y="218" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="14" fill="#1C8577" font-weight="bold" text-anchor="start">子步：h ← h + (α/K)·fₗ(h)，重复 K 次</text>
<rect x="700" y="262" width="460" height="130" rx="14" fill="#F1F4F8" stroke="#C7D1DC" stroke-width="1.2"/>
<text x="720" y="292" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start">做法</text>
<text x="720" y="320" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13.5" fill="#22313F" font-weight="normal" text-anchor="start">· 推理时包装器：只循环冻结模型中段的一段连续层</text>
<text x="720" y="346" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13.5" fill="#22313F" font-weight="normal" text-anchor="start">· 不改权重、不微调、不继续训练、不改结构</text>
<text x="720" y="372" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13.5" fill="#22313F" font-weight="normal" text-anchor="start">· 论文指出：直接重复整块通常会降低性能</text>
<rect x="700" y="406" width="460" height="172" rx="14" fill="#E3F5F2" stroke="#9ED9CF" stroke-width="1.2"/>
<text x="720" y="436" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="16" fill="#1C8577" font-weight="bold" text-anchor="start">结果（论文摘要，7 个模型族）</text>
<text x="720" y="466" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="14" fill="#22313F" font-weight="normal" text-anchor="start">· Qwen3-4B-Instruct：MMLU-Pro +2.64 pp</text>
<text x="720" y="494" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="14" fill="#22313F" font-weight="normal" text-anchor="start">· Qwen3-30B-A3B-Instruct：CommonsenseQA +1.14 pp</text>
<text x="720" y="522" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="14" fill="#22313F" font-weight="normal" text-anchor="start">· Moonlight-16B-A3B-Instruct：OpenBookQA +1.20 pp</text>
<text x="720" y="554" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="13" fill="#5B6B7F" font-weight="normal" text-anchor="start">覆盖稠密、稀疏 MoE 与 MLA+MoE 结构</text>
<text x="40" y="602" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Source Han Sans SC, sans-serif" font-size="12.5" fill="#8A97A6" font-weight="normal" text-anchor="start">本文绘制（轨迹为示意）。依据：Training-Free Looped Transformers（Chen et al., arXiv 2605.23872）。α 为阻尼系数，K 为子步数。</text>
</svg>